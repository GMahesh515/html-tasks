<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>

<body>
    <form name="form" action="http://mahesh.server" method="post">
        <table align="center" style="background-color: silver; ">
            <caption>
                <h3>Registration form</h3>
            </caption>
            <tr>
                <td><label for="fname">FullName</label> </td>
                <td><input type="text" id="fname" name="Fullname" placeholder="enter full name"></td>
            </tr>
            <tr>
                <td><label for="phone">mobile number</label></td>
                <td><select>
                        <option value="+91"> +91</option>
                        <option value="+44">+44</option>
                        <option value="+61">+61</option>
                        <option value="+49">+49</option>
                        <option value="+81"> +81</option>
                    </select><input type="tel" id="phone" name="mobile_number" placeholder="enter phone number"></td>
            <tr>
                <td><label for="pin">pincode</label></td>
                <td><input type="number" id="pin" name="pincode"></td>
            </tr>
            <tr>
                <td><label for="email"> email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="userid">UserId</label> </td>
                <td><input type="text" id="userid" name="userid" required></td>
            </tr>
            <tr>
                <td><label for="password"> confirm Password</label></td>
                <td><input type="password" id="password" name="password" placeholder="enter conform password" required>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="submit" style="background-color: rgb(124, 80, 255); float: right;margin-left: 5px;">
                <input type="reset" value="erase" style="background-color: rgb(95, 255, 80); float: right;"></td>
            </tr>
        </table>
    </form>
</body>

</html>
