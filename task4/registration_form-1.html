<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form-1</title>
</head>

<body>
    <form name="form-1" action="http://mahesh.service" method="get">
        <table align="center" style="background-color:silver">
            <caption>
                <h3>Registration form</h3>
            </caption>
            <tr>
                <td><label for="fname">FirstName</label> </td>
                <td><input type="text" id="fname" name="Firstname" required></td>
            </tr>
            <tr>
                <td><label for="lname">LirstName</label> </td>
                <td><input type="text" id="lname" name="Lastname" required></td>
            </tr>
            <tr>
                <td><label for="nickname"> NickName</label></td>
                <td><input type="text" id="nickname" name="nickName" required></td>
            </tr>
            <tr>
                <td><label for="email"> email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="DOB"> Date Of Bitrth</label></td>
                <td><input type="date" id="DOB" name="dob" required></td>
            </tr>
            <tr>
                <td><label for="gender"> Gender</label></td>
                <td><label><input type="radio" name="gender" value="male">male</label>
                    <label><input type="radio" name="gender" value="female">female</label>
                    <label><input type="radio" name="gender" value="other">other</label>
            </tr>
            <tr>
                <td><label for="phone">phone number</label></td>
                <td><input type="tel" id="phone" name="phone number"></td>
            </tr>
            <tr>
                <td><label for="address">address</label></td>
                <td><textarea id="address" name="address" rows="3" cols="17"></textarea></td>
            </tr>
            
            <tr>
                <td></td>
                <td><input type="submit" value="login">
                <input type="reset" value="clear"></td>
            </tr>
        </table>
    </form>

</body>

</html>
